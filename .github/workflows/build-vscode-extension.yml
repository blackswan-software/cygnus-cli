name: Build & release VS Code extension

# Builds the cygnus VS Code extension (.vsix) and attaches it to a
# GitHub Release. We deliberately do NOT publish to the Microsoft
# Marketplace or Open VSX — distribution is via:
#
#   cygnus extension install vscode
#
# which pulls the latest .vsix from this repo's releases page (see
# cygnus/cli.py:cmd_extension_install).
#
# Triggers:
#   - on tag push matching `vscode-v*` (e.g. vscode-v0.1.0) → release
#   - on PR touching vscode-extension/** → compile + run e2e tests only

on:
  push:
    tags:
      - 'vscode-v*'
  pull_request:
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/build-vscode-extension.yml'

permissions:
  contents: write  # needed to attach the .vsix to a release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run e2e tests (headless VS Code)
        run: xvfb-run -a npm test
        env:
          DISPLAY: ':99'

      - name: Package extension to .vsix
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: npx vsce package --no-dependencies

      - name: Attach .vsix to release
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true
